name: Build CATATAN TOKO AKMAL V3

on:
  workflow_dispatch:
  push:
    branches:
      - utama

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v6

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project V3
        run: |
          mkdir project
          unzip -q CATATAN_TOKO_AKMAL_V3_TABLET.zip -d project
          echo "Isi project:"
          find project -maxdepth 2 -type f | head -50

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-TOKO-AKMAL-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
