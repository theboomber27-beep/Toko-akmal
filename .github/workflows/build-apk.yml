name: Build CATATAN TOKO AKMAL V3

on:
  workflow_dispatch:
  push:
    branches:
      - utama

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v6

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project V3
        run: |
          mkdir -p project
          unzip -q CATATAN_TOKO_AKMAL_V3_TABLET.zip -d project
          echo "Isi project:"
          find project -maxdepth 3 -type f | head -80

      - name: Perbaiki target Java menjadi 17
        run: |
          find project -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | while IFS= read -r -d '' file; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"1.8"/jvmTarget = "17"/g' "$file"
            sed -i "s/jvmTarget[[:space:]]*=[[:space:]]*'1.8'/jvmTarget = '17'/g" "$file"
          done

          echo "Konfigurasi Java/Kotlin setelah diperbaiki:"
          grep -R -n -E "VERSION_1_8|VERSION_17|jvmTarget" project --include="*.gradle" --include="*.gradle.kts" || true

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project/CATATAN_TOKO_AKMAL_V3_TABLET
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-TOKO-AKMAL-V3-APK
          path: project/CATATAN_TOKO_AKMAL_V3_TABLET/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
